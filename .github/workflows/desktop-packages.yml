name: Desktop Packages (macOS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "packages/desktop/**"
      - "plugins/**"
      - ".github/workflows/desktop-packages.yml"
  workflow_dispatch:

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  macos:
    name: macos binary
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS desktop binary
        run: npm run build:desktop -- --publish never --mac --arm64 --x64
        env:
          EP_GH_IGNORE_TIME: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-macos
          path: packages/desktop/release/*.dmg
          if-no-files-found: ignore
          retention-days: 14
